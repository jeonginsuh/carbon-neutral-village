<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탄소중립 마을 가꾸기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f9f4;
            margin: 0;
        }
        .container {
            max-width: 420px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2e7d32;
            font-size: 24px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active {
            background-color: #388e3c;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
            font-size: 16px;
            line-height: 1.6;
        }
        .score-box {
            margin-top: 20px;
            background: #eef7ee;
            padding: 15px;
            border-radius: 10px;
            color: #1b5e20;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌱 탄소중립 마을</h1>
    <p>활동을 기록하고 포인트를 적립하세요!</p>

    <input type="text" id="userId" placeholder="학생 이름을 입력하세요">

    <button onclick="recordAction('recycle')">♻️ 분리배출 실천하기</button>
    <button onclick="recordAction('bike')" style="background-color: #2196f3;">🚲 자전거 타기 실천</button>

    <div id="result"></div>
    <div id="scoreBox" class="score-box">현재 포인트: 0</div>
</div>

<script>
    const STORAGE_KEY = 'carbonVillageScores';

    function getUserData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : {};
    }

    function saveUserData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getDisplayName() {
        const name = document.getElementById('userId').value.trim();
        return name || '학생';
    }

    function recordAction(actionType) {
        const userName = getDisplayName();
        const data = getUserData();

        if (!data[userName]) {
            data[userName] = {
                recycle: 0,
                bike: 0
            };
        }

        const points = {
            recycle: 10,
            bike: 15
        };

        data[userName][actionType] += points[actionType];

        saveUserData(data);

        const total = data[userName].recycle + data[userName].bike;

        document.getElementById('result').innerText =
            `${userName}님, ${actionType === 'recycle' ? '분리배출' : '자전거 타기'} 활동을 기록했습니다!`;

        document.getElementById('scoreBox').innerText =
            `현재 포인트: ${total}점 (분리배출 ${data[userName].recycle}점, 자전거 ${data[userName].bike}점)`;
    }
</script>

</body>
</html>
